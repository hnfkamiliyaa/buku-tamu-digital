
services:
  backend:
    build: .
    container_name: guestbook-backend
    restart: always
    networks:
      - app-net
    volumes:
      - guestbook-db-data:/home/appuser

  nginx-gateway:
    image: nginx:alpine
    container_name: guestbook-nginx
    restart: always
    ports:
      - "8082:8081"
    networks:
      - app-net
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  guestbook-db-data:

networks:
  app-net:
    driver: bridge
